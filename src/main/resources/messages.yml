prefix: "<dark_gray>[<gold>荣誉决斗</gold>]</dark_gray> "

errors:
  no-permission: "<red>你没有权限使用该命令。"
  player-only: "<red>该命令只能由玩家执行。"
  player-not-found: "<red>目标玩家不在线。"
  self-duel: "<red>你不能向自己发起荣誉决斗。"
  already-in-duel: "<red>你已经处于荣誉决斗中。"
  target-in-duel: "<red>对方正在进行荣誉决斗。"
  invite-expired: "<red>这份决斗邀请已经失效。"
  no-pending-invite: "<red>你没有待处理的荣誉决斗邀请。"
  arena-not-found: "<red>没有可用的决斗场。"
  arena-world-not-loaded: "<red>决斗场世界尚未加载，请联系管理员。"
  teleport-failed: "<red>传送至决斗场失败，本次决斗已取消。"
  disabled-world: "<red>当前世界不允许发起荣誉决斗。"
  command-blocked: "<red>荣誉决斗期间不能使用该命令。"
  invalid-mode: "<red>无效的决斗模式。"
  database-error: "<red>荣誉决斗数据读写失败，请联系管理员。"
  invite-pending: "<red>你或对方还有未处理的决斗邀请。"
  cooldown: "<red>你需要等待 <yellow>{seconds}</yellow> 秒后才能再次发起荣誉决斗。"
  same-world-required: "<red>当前设置要求双方位于同一世界。"
  flying: "<red>飞行状态下不能发起荣誉决斗。"
  vanished: "<red>当前状态不能发起荣誉决斗。"
  same-ip: "<red>当前设置不允许相同 IP 的玩家互相决斗。"
  in-combat: "<red>你或对方刚刚处于战斗状态，暂时不能发起荣誉决斗。"
  player-offline-during-setup: "<red>对方在准备阶段离线，本次决斗已取消。"
  already-selecting: "<red>你当前正在确认一场荣誉决斗。"
  no-active-duel: "<red>你当前不在荣誉决斗中。"
  return-location-missing: "<red>全局返回点尚未设置，将返回原位置。"
  unknown-arena: "<red>该决斗场不存在。"
  arena-exists: "<red>该决斗场已存在。"
  invalid-spawn-index: "<red>出生点编号只能是 1 或 2。"

duel:
  invite-sent: "<gray>你向 <yellow>{target}</yellow> 发起了荣誉决斗邀请。"
  invite-received: "<yellow>{challenger}</yellow> <gray>向你发起了荣誉决斗。输入 <green>/duel accept</green> 接受，或 <red>/duel deny</red> 拒绝。"
  invite-denied: "<gray>你拒绝了来自 <yellow>{challenger}</yellow> 的荣誉决斗邀请。"
  invite-cancelled: "<gray>你取消了荣誉决斗邀请。"
  accepted: "<green>荣誉决斗已接受，正在选择契约规则……"
  preparing: "<gray>正在准备决斗场：<yellow>{arena}</yellow>"
  countdown: "<gold>{seconds}</gold> <gray>秒后开始荣誉决斗。"
  started: "<red>荣誉决斗开始！"
  victory: "<gold>{winner}</gold> <gray>赢得了与 <red>{loser}</red> 的荣誉决斗。"
  draw: "<gray>本场荣誉决斗以平局结束。"
  surrender: "<yellow>{player}</yellow> <gray>认输了。"
  quit-lose: "<yellow>{player}</yellow> <gray>在决斗中离线，判定失败。"
  returned: "<gray>你已返回决斗前位置。"
  mode-selected: "<gray>已选择模式：<yellow>{mode}</yellow>"

admin:
  arena-created: "<green>已创建决斗场配置：<yellow>{arena}</yellow>"
  arena-deleted: "<green>已删除决斗场配置：<yellow>{arena}</yellow>"
  spawn-set: "<green>已设置 <yellow>{arena}</yellow> 的出生点 <yellow>{spawn}</yellow>。"
  spectator-set: "<green>已设置 <yellow>{arena}</yellow> 的观战点。"
  return-set: "<green>已设置全局返回点。"
  arena-enabled: "<green>已启用决斗场：<yellow>{arena}</yellow>"
  arena-disabled: "<yellow>已禁用决斗场：<yellow>{arena}</yellow>"
  reloaded: "<green>StellarDuelBridge 配置已重载。"
  arena-list-header: "<gold>决斗场列表："
  arena-list-line: "<gray>- <yellow>{arena}</yellow> <gray>| 启用：<white>{enabled}</white> <gray>| 世界：<white>{world}</white> <gray>| 状态：<white>{state}</white>"

help:
  header: "<gold>荣誉决斗命令"
  lines:
    - "<gray>/duel <玩家> <dark_gray>- <white>发起荣誉决斗邀请"
    - "<gray>/duel accept <dark_gray>- <white>接受最近的邀请"
    - "<gray>/duel deny <dark_gray>- <white>拒绝最近的邀请"
    - "<gray>/duel cancel <dark_gray>- <white>取消已发出的邀请"
    - "<gray>/duel leave <dark_gray>- <white>认输并离开当前决斗"
    - "<gray>/duel stats [玩家] <dark_gray>- <white>查看基础战绩"

stats:
  header: "<gold>{player}</gold> <gray>的荣誉决斗战绩"
  line-1: "<gray>胜场：<green>{wins}</green> 负场：<red>{losses}</red> 平局：<yellow>{draws}</yellow>"
  line-2: "<gray>退出判负：<red>{quits}</red> 连胜：<yellow>{streak}</yellow> 最佳连胜：<gold>{best_streak}</gold>"
  line-3: "<gray>总场次：<white>{total_matches}</white> 总时长：<white>{duration}</white>"
